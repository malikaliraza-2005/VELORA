[project]
name = "velora"
version = "0.1.0"
description = "VELORA backend: WhatsApp ordering SaaS for restaurants (FastAPI ingress + workers)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anyio>=4.15.1",
    "cryptography>=46",
    "fastapi",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
    "segno>=1.6.6",
    # The production server (P12, `python -m velora.serve`).
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.15.1",
    "mypy",
    "playwright>=1.64.0",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/velora"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["velora"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
