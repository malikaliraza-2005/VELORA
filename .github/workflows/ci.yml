name: CI

# P1-T5: lint, type checks, tests and a secret scan on every push and pull request.
# P2-T6: the tests include the tenant-isolation suite, run against PostgreSQL.
# P9: and the staff dashboard's browser tests, in headless Chromium.
# P12: and a rehearsal of the deployment itself (infra/tests/stack-drill.sh).
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Install (locked)
        run: uv sync --locked
      - name: Format check
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy
      # P0-E1: the OpenWA trial kit is standard-library Python outside the package.
      - name: Lint the trial kit
        run: |
          uv run ruff format --config pyproject.toml --check ../trial
          uv run ruff check --config pyproject.toml ../trial
      # P2: database tests need a disposable PostgreSQL 17. The superuser password is
      # generated per run; the test session sets random passwords for the VELORA roles.
      - name: Start PostgreSQL 17
        run: |
          pw="$(openssl rand -hex 16)"
          echo "::add-mask::$pw"
          docker run -d --name velora-pg -e POSTGRES_PASSWORD="$pw"             -p 127.0.0.1:5432:5432 postgres:17
          # Probe over TCP: the image's init-time server listens on the socket only.
          for _ in $(seq 1 60); do
            docker exec velora-pg pg_isready -q -h 127.0.0.1 -U postgres && break
            sleep 1
          done
          docker exec velora-pg pg_isready -h 127.0.0.1 -U postgres
          echo "VELORA_TEST_ADMIN_URL=postgresql://postgres:$pw@127.0.0.1:5432/postgres" >> "$GITHUB_ENV"
      # P9: the dashboard tests drive headless Chromium (Playwright, version from uv.lock).
      - name: Install Chromium for the dashboard tests
        run: uv run playwright install --with-deps chromium
      - name: Tests
        env:
          # Fail, rather than skip, if the database or browser tests cannot run.
          VELORA_REQUIRE_DB_TESTS: "1"
          VELORA_REQUIRE_BROWSER_TESTS: "1"
          VELORA_REQUIRE_COMPOSE_TESTS: "1"
          VELORA_TEST_PG_TOOLS: docker exec -i velora-pg
        run: uv run pytest

  # P12: the real compose stack on one runner, through the founder's `velora` tool: a first
  # release, the edge and secrets checks, the failure drills with alerts, a release and a
  # rollback. The record is added to the run's summary.
  deploy:
    name: Deployment rehearsal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint the shell scripts
        run: shellcheck infra/bin/velora infra/host/install.sh infra/tests/stack-drill.sh trial/setup.sh trial/sample-resources.sh
      - name: Rehearse a deployment, the failure drills, a release and a rollback
        env:
          VELORA_DRILL_RECORD: ${{ runner.temp }}/drill-record.md
        run: infra/tests/stack-drill.sh
      - name: Drill record
        if: always()
        run: cat "$RUNNER_TEMP/drill-record.md" >> "$GITHUB_STEP_SUMMARY" || true

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Scans the FULL git history on every run (not just the pushed range, which
      # fails on a repository's first commit). Version pinned; matches pre-commit.
      - name: Run gitleaks on full history
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --verbose --exit-code 1
      # P1 acceptance: prove the scanner FLAGS a commit containing a fake key.
      # The fake key is assembled at runtime in a throwaway repo, so no secret is
      # ever committed here. Leaks use exit code 3 so tool errors (exit 1) can't
      # be mistaken for a detection.
      - name: Self-test - scanner must flag a fake key
        run: |
          tmp="$(mktemp -d)"
          git -C "$tmp" init -q
          git -C "$tmp" config user.email ci@example.invalid
          git -C "$tmp" config user.name ci
          printf 'aws_access_key_id = "%s%s"\n' "AKIA" "QYLPMN5TBVOW3RDS" > "$tmp/leak.txt"
          git -C "$tmp" add leak.txt
          git -C "$tmp" commit -qm "fake key (scanner self-test)"
          set +e
          docker run --rm --user "$(id -u):$(id -g)" -v "$tmp:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --exit-code 3
          code=$?
          set -e
          if [ "$code" -ne 3 ]; then
            echo "FAIL: expected gitleaks to flag the fake key (exit 3), got exit $code"
            exit 1
          fi
          echo "PASS: the fake-key commit was detected."
